name: sync-check

# 云上同步校验（不需要大磁盘）：
#   1) repo init + 只同步终端相关项目（设备树/vendor/TerminalHome/内核/blobs，约数 GB）
#   2) 校验 Termux APK 版本锁定（下载 + sha256）
#   3) 校验产品配置/预置/overlay 契约（verify-wiring.sh）
#   4) 报告上传 artifact，并把结果写回 ci-status 分支（便于无 UI 场景核对）
#
# 触发：
#   - workflow_dispatch（手动，可选 22.2 / 23.2）
#   - push 到 ci/** 分支（分支名含 23.2 则用 23.2，否则 22.2）
#
# 注意：本 workflow 不构建 ROM；整包构建见 build-rom.yml（需要 ≥400GB 磁盘的 runner）。

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS manifest 分支'
        type: choice
        default: lineage-22.2
        options:
          - lineage-22.2
          - lineage-23.2
  push:
    branches:
      - 'ci/**'

permissions:
  contents: write

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LINEAGE_BRANCH: ${{ inputs.lineage_branch || (contains(github.ref_name, '23.2') && 'lineage-23.2' || 'lineage-22.2') }}
      WORKSPACE: ${{ github.workspace }}/android
    steps:
      - uses: actions/checkout@v4

      - name: 显示目标
        run: |
          echo "lineage branch : $LINEAGE_BRANCH"
          echo "trigger ref    : $GITHUB_REF"
          echo "workspace      : $WORKSPACE"

      - name: 释放磁盘空间并显示可用空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: 安装 repo 工具
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: 配置 git
        run: |
          set -euo pipefail
          git config --global user.name "TerminalOS CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global trailer.changeid.key "Change-Id"
          git lfs install

      - name: repo init
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init -u https://github.com/LineageOS/android.git -b "$LINEAGE_BRANCH" --git-lfs --no-clone-bundle

      - name: 安装 local manifest
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/local_manifests/terminalos-22.2.xml"
          if [ "$LINEAGE_BRANCH" = "lineage-23.2" ]; then
              src="$GITHUB_WORKSPACE/local_manifests/terminalos.xml"
          fi
          mkdir -p "$WORKSPACE/.repo/local_manifests"
          cp "$src" "$WORKSPACE/.repo/local_manifests/terminalos.xml"
          echo "using local manifest: $src"
          sed -n '1,120p' "$WORKSPACE/.repo/local_manifests/terminalos.xml"

      - name: repo sync（仅终端相关项目）
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          repo sync -c --no-tags -j4 \
              device/xiaomi/polaris \
              vendor/terminalos \
              packages/apps/TerminalHome \
              kernel/xiaomi/sdm845 \
              vendor/xiaomi/polaris \
              vendor/xiaomi/sdm845-common

      - name: 校验 Termux APK 版本锁定（下载 + sha256）
        run: |
          set -euo pipefail
          cd "$WORKSPACE/vendor/terminalos"
          bash scripts/fetch-termux.sh
          # sha256 文件里是相对文件名（Termux.apk），必须在 prebuilt/ 目录内校验
          ( cd prebuilt && sha256sum --check Termux.apk.sha256 )

      - name: 结构校验（产品/预置/overlay/禁止刷机命令）
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-wiring.sh"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-check-${{ env.LINEAGE_BRANCH }}
          path: out/ci/
          retention-days: 14
          if-no-files-found: warn

      - name: 写回 ci-status 分支
        if: always()
        env:
          JOB_KIND: sync-check
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOB_DETAIL=$(printf '{"lineage_branch":"%s","runner":"ubuntu-24.04"}' "$LINEAGE_BRANCH") \
            bash "$GITHUB_WORKSPACE/.github/scripts/publish-status.sh"
